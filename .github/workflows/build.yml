name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build with Maven
        run: mvn -B -f Frost/pom.xml clean package

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: Frost-jar
          path: Frost/target/*.jar
          if-no-files-found: error

      - name: Publish to GitHub Packages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        run: mvn -B -f Frost/pom.xml deploy -DskipTests
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Publish to Hangar (Release/Beta/Alpha from version)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: |
          if [ -z "$HANGAR_API_TOKEN" ]; then echo "HANGAR_API_TOKEN not set, skipping Hangar publish"; exit 0; fi
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f Frost/pom.xml)
          COMMIT_DESC=$(git log -1 --pretty=%B)
          if [[ "$VERSION" == *"-alpha"* ]]; then CHANNEL=Alpha; elif [[ "$VERSION" == *"-beta"* ]]; then CHANNEL=Beta; else CHANNEL=Release; fi
          echo "Publishing Frost $VERSION to Hangar FragMC/Frost channel $CHANNEL"
          # Check if version already exists on Hangar
          JWT_CHECK=$(curl -s -X POST "https://hangar.papermc.io/api/v1/authenticate?apiKey=$HANGAR_API_TOKEN" | grep -o '"token":"[^"]*' | cut -d'"' -f4)
          if [ -n "$JWT_CHECK" ]; then
            EXISTS=$(curl -s -H "Authorization: $JWT_CHECK" "https://hangar.papermc.io/api/v1/projects/FragMC/Frost/versions/$VERSION" | grep -o '"version":"[^"]*"' || true)
            if [ -n "$EXISTS" ]; then echo "Version $VERSION already exists on Hangar, skipping"; exit 0; fi
          fi
          echo "$COMMIT_DESC" > /tmp/changelog.txt
          JWT=$(curl -s -X POST "https://hangar.papermc.io/api/v1/authenticate?apiKey=$HANGAR_API_TOKEN" | grep -o '"token":"[^"]*' | cut -d'"' -f4)
          if [ -z "$JWT" ]; then echo "Failed to authenticate with Hangar"; exit 0; fi
          curl -s -X POST "https://hangar.papermc.io/api/v1/projects/FragMC/Frost/versions" \
            -H "Authorization: $JWT" \
            -F "channel=$CHANNEL" -F "version=$VERSION" -F "changelog=@/tmp/changelog.txt" \
            -F "files=@Frost/target/frost-$VERSION.jar;type=application/java-archive" \
            -F "platform=PAPER" -F "platformVersions=[\"26.2\"]" || echo "Hangar publish failed (ignoring)"
          echo "Hangar publish attempted for $VERSION on $CHANNEL"

      - name: Create GitHub Release with commit description as Maven release notes
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f Frost/pom.xml)
          COMMIT_DESC=$(git log -1 --pretty=%B)
          echo "Version: $VERSION"
          echo "Commit description:"
          echo "$COMMIT_DESC"
          # Create release with commit description as body (tag v$VERSION)
          gh release create "v$VERSION" --title "Frost $VERSION" --notes "$COMMIT_DESC" --target ${{ github.sha }} || echo "Release already exists or failed (may be 409, ignoring)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
