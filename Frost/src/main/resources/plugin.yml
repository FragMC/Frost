name: Frost
version: 2.0.5-alpha
main: com.stufy.fragmc.frost.Frost
api-version: '26.2'
depend:
  - Vault
softdepend:
  - Geyser-Spigot
  - floodgate
  - FreeMinecraftModels
commands:
  frost:
    description: Admin Frost command
    usage: /frost <reload|setprofile|listprofiles|givecosmetic|inventory>
    permission: frost.admin
  shop:
    description: Open the cosmetics shop
    usage: /shop
  equip:
    description: Open the equipment menu
    usage: /equip
  togglelock:
    description: Toggle hotbar lock
    usage: /togglelock
  inventory:
    description: Customize your hotbar (slots 4-9) - double chest GUI
    usage: /inventory
    aliases: [inv, custominv, hotbar]

permissions:
  frost.admin:
    description: Access to admin commands
    default: op
  frost.shop:
    description: Access to cosmetics shop
    default: true
  frost.equip:
    description: Access to equipment menu
    default: true
